version: '3.8'

services:
  # ------------------------------------------
  # Redis 7 (Caching, Socket.IO adapter, BullMQ)
  # ------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: orbat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-orbat_secure_redis_pass_123}
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-orbat_secure_redis_pass_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbat-net

  # ------------------------------------------
  # Orbat AI NestJS Backend API
  # ------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbat-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=true
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-orbat_secure_redis_pass_123}@redis:6379
      - CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_R2_ACCOUNT_ID}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME:-orbat-chat-uploads}
      - CLOUDFLARE_R2_PUBLIC_URL=${CLOUDFLARE_R2_PUBLIC_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orbat-net

  # ------------------------------------------
  # Orbat AI Background Workers (BullMQ)
  # ------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: orbat-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - IS_WORKER=true
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=true
      - REDIS_URL=redis://:${REDIS_PASSWORD:-orbat_secure_redis_pass_123}@redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orbat-net

volumes:
  redis_prod_data:
    driver: local

networks:
  orbat-net:
    driver: bridge

