<div class="{{rootClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); overflow: hidden">
  <sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
    <header style="padding: 20px 16px 10px; background: var(--surface); display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--border)">
      <div style="display: flex; align-items: center; gap: 10px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; flex: 1">Inbox</h1>
        <button type="button" onClick="{{toggleDark}}" aria-label="Toggle dark mode" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
        <span style="position: relative; width: 36px; height: 36px; border-radius: 99px; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: #E9D8FD; color: #3B1F73">AM<span style="position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 99px; background: var(--ok); border: 2px solid var(--surface)"></span></span>
      </div>
      <div style="display: flex; gap: 8px; overflow-x: auto">
        <sc-for list="{{chips}}" as="c"><button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 36px; padding: 0 14px; border: 1px solid {{c.bd}}; border-radius: 99px; background: {{c.bg}}; color: {{c.color}}; font-size: 14px; font-weight: 500; white-space: nowrap">{{c.label}} <span class="mono" style="font-size: 12px; opacity: .75">{{c.n}}</span></button></sc-for>
      </div>
    </header>
    <div style="flex: 1; overflow: auto">
      <sc-for list="{{list}}" as="c" hint-placeholder-count="6">
        <button type="button" onClick="{{c.open}}" style="width: 100%; display: flex; gap: 12px; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--border); background: var(--surface); text-align: left; min-height: 76px">
          <span style="flex: none; width: 42px; height: 42px; border-radius: 99px; display: grid; place-items: center; font-size: 14px; font-weight: 600; {{c.av}}">{{c.ini}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="display: flex; gap: 6px; align-items: center"><span style="flex: 1; font-weight: {{c.w}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.name}}</span><span class="mono" style="font-size: 12px; color: var(--text-3)">{{c.time}}</span></span>
            <span style="font-size: 14px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.preview}}</span>
            <span style="display: flex; gap: 6px; margin-top: 4px"><span style="font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 99px; {{c.tone}}">{{c.handler}}</span><sc-if value="{{c.flag}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn)">{{c.flag}}</span></sc-if></span>
          </span>
        </button>
      </sc-for>
    </div>
    <nav aria-label="App" style="display: flex; border-top: 1px solid var(--border); background: var(--surface); padding: 4px 8px 20px">
      <sc-for list="{{tabs}}" as="t"><a href="{{t.href}}" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 500; text-decoration: none; color: {{t.color}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.label}}</a></sc-for>
    </nav>
  </sc-if>

  <sc-if value="{{isConvo}}" hint-placeholder-val="{{false}}">
    <header style="display: flex; align-items: center; gap: 6px; padding: 12px 8px 10px; background: var(--surface); border-bottom: 1px solid var(--border)">
      <button type="button" onClick="{{back}}" aria-label="Back to inbox" style="width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; color: var(--accent-text)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <span style="width: 36px; height: 36px; border-radius: 99px; display: grid; place-items: center; font-size: 13px; font-weight: 600; {{cur.av}}">{{cur.ini}}</span>
      <div style="flex: 1; min-width: 0"><div style="font-weight: 600">{{cur.name}}</div><div style="font-size: 12.5px; color: var(--text-3)">{{cur.sub}}</div></div>
      <button type="button" onClick="{{resolve}}" style="height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--accent); color: #FFFFFF; font-size: 14px; font-weight: 500">{{resolveLabel}}</button>
    </header>
    <div style="flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <button type="button" onClick="{{toggleSummary}}" aria-expanded="{{summaryAria}}" style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 0; border-radius: 12px; background: var(--ai-soft); text-align: left">
        <span style="display: flex; justify-content: space-between; width: 100%; font-size: 13.5px; font-weight: 600; color: var(--ai-text)">Smart handoff from Nova<span>{{summaryCaret}}</span></span>
        <span style="font-size: 14px; color: var(--text)">{{cur.summary}}</span>
        <sc-if value="{{summaryOpen}}" hint-placeholder-val="{{false}}"><span style="font-size: 13.5px; color: var(--text-2)"><b style="color: var(--text)">Next step:</b> Open a UPS trace and offer free express re-ship if no scan by Wednesday.</span></sc-if>
      </button>
      <sc-for list="{{msgs}}" as="m">
        <sc-if value="{{m.isIn}}" hint-placeholder-val="{{true}}"><div style="align-self: flex-start; max-width: 82%; padding: 10px 13px; border-radius: 4px 14px 14px 14px; background: var(--surface); border: 1px solid var(--border)">{{m.t}}</div></sc-if>
        <sc-if value="{{m.isAi}}" hint-placeholder-val="{{false}}"><div style="align-self: flex-end; max-width: 82%; padding: 10px 13px; border-radius: 14px 4px 14px 14px; background: var(--ai-soft)"><div style="font-size: 11.5px; font-weight: 600; color: var(--ai-text); margin-bottom: 2px">Nova · AI</div>{{m.t}}</div></sc-if>
        <sc-if value="{{m.isOut}}" hint-placeholder-val="{{false}}"><div style="align-self: flex-end; max-width: 82%; padding: 10px 13px; border-radius: 14px 4px 14px 14px; background: var(--accent); color: #FFFFFF">{{m.t}}</div></sc-if>
        <sc-if value="{{m.isNote}}" hint-placeholder-val="{{false}}"><div style="align-self: flex-end; max-width: 82%; padding: 10px 13px; border-radius: 12px; background: var(--note); border: 1px dashed var(--note-border)"><div style="font-size: 11.5px; font-weight: 600; color: var(--warn); margin-bottom: 2px">Internal note</div>{{m.t}}</div></sc-if>
      </sc-for>
    </div>
    <div style="padding: 8px 10px 22px; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 6px">
        <button type="button" onClick="{{modeReply}}" aria-pressed="{{replyAria}}" style="height: 34px; padding: 0 12px; border: 0; border-radius: 8px; font-size: 13.5px; font-weight: 500; background: {{replyBg}}">Reply</button>
        <button type="button" onClick="{{modeNote}}" aria-pressed="{{noteAria}}" style="height: 34px; padding: 0 12px; border: 0; border-radius: 8px; font-size: 13.5px; font-weight: 500; background: {{noteBg}}; color: {{noteC}}">Note</button>
        <button type="button" onClick="{{suggest}}" style="margin-left: auto; height: 34px; padding: 0 12px; border: 0; border-radius: 8px; font-size: 13.5px; font-weight: 500; background: var(--ai-soft); color: var(--ai-text)">Suggest</button>
      </div>
      <div style="display: flex; gap: 8px">
        <label for="mcomp" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
        <input id="mcomp" value="{{draft}}" onInput="{{onDraft}}" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 22px; background: {{inputBg}}; font-size: 15px">
        <button type="button" onClick="{{send}}" aria-label="Send" style="width: 44px; height: 44px; border: 0; border-radius: 99px; background: var(--accent); color: #FFFFFF; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"></path></svg></button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>

class Component extends DCLogic {
