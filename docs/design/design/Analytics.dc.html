<div class="{{rootClass}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: var(--bg)">
  <div style="flex: 1 1 232px; background: var(--side); display: flex">
    <dc-import name="Sidebar" active="analytics" hint-size="232px,900px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="Topbar" heading="{{secLabel}}" sub="Analytics" dark="{{dark}}" on-toggle-theme="{{toggleTheme}}" hint-size="100%,56px"></dc-import>
    <div style="display: flex; flex-wrap: wrap; flex: 1">
      <nav aria-label="Reports" style="flex: 0 1 220px; min-width: 200px; padding: 20px 12px; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 2px">
        <div style="padding: 0 10px 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3)">Reports</div>
        <sc-for list="{{secs}}" as="x"><button type="button" onClick="{{x.pick}}" aria-current="{{x.cur}}" class="hov" style="height: 34px; padding: 0 10px; border: 0; border-radius: 7px; text-align: left; font-size: 13.5px; background: {{x.bg}}; color: {{x.color}}; font-weight: {{x.weight}}">{{x.label}}</button></sc-for>
        <div style="padding: 16px 10px 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3)">Custom reports</div>
        <button type="button" class="hov" style="height: 34px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; text-align: left; font-size: 13.5px; color: var(--text-2)">Weekly exec summary</button>
        <button type="button" class="hov" style="height: 34px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; text-align: left; font-size: 13.5px; color: var(--text-2)">Refund drivers · Q4</button>
        <button type="button" class="hov" style="height: 34px; padding: 0 10px; border: 1px dashed var(--border-strong); border-radius: 7px; background: transparent; text-align: left; font-size: 13px; color: var(--text-2); margin-top: 4px">+ New report</button>
      </nav>
      <div style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
          <div><h2 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">{{secLabel}}</h2><p style="margin: 2px 0 0; color: var(--text-2); font-size: 13.5px">{{secDesc}}</p></div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
            <div role="group" aria-label="Date range" style="display: flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--surface-3)">
              <sc-for list="{{ranges}}" as="r"><button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="height: 30px; padding: 0 12px; border: 0; border-radius: 7px; font-size: 13px; font-weight: 500; background: {{r.bg}}; color: {{r.color}}">{{r.label}}</button></sc-for>
            </div>
            <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2)"><input type="checkbox" checked="{{compare}}" onChange="{{toggleCompare}}" style="accent-color: var(--accent)">Compare to previous</label>
            <button type="button" class="hov" style="height: 34px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 13px; font-weight: 500">Export CSV</button>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px">
          <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4"><div style="padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface)"><div style="font-size: 13px; color: var(--text-2)">{{k.l}}</div><div class="mono" style="font-size: 24px; font-weight: 600; margin-top: 6px">{{k.v}}</div>
            <sc-if value="{{compare}}" hint-placeholder-val="{{true}}"><div style="font-size: 12px; margin-top: 4px"><span style="font-weight: 600; color: {{k.dc}}">{{k.d}}</span> <span style="color: var(--text-3)">vs previous</span></div></sc-if></div></sc-for>
        </div>

        <section style="padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px"><div><h3 style="margin: 0; font-size: 15px; font-weight: 600">{{chartTitle}}</h3><p style="margin: 2px 0 0; font-size: 13px; color: var(--text-2)">{{drillLine}}</p></div>
            <sc-if value="{{compare}}" hint-placeholder-val="{{true}}"><span style="display: flex; gap: 14px; font-size: 12px; color: var(--text-2); align-items: center"><span style="display: flex; gap: 6px; align-items: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--accent)"></span>This period</span><span style="display: flex; gap: 6px; align-items: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--border-strong)"></span>Previous</span></span></sc-if>
          </div>
          <sc-if value="{{isBars}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <div style="height: 220px; display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid var(--border); background: linear-gradient(var(--border) 1px, transparent 1px) 0 0 / 100% 55px">
                <sc-for list="{{bars}}" as="b"><button type="button" onClick="{{b.drill}}" title="{{b.title}}" aria-label="{{b.title}}" style="flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; gap: 2px; border: 0; padding: 0; background: transparent">
                  <sc-if value="{{compare}}" hint-placeholder-val="{{true}}"><span style="flex: 1; height: {{b.hp}}px; border-radius: 3px 3px 0 0; background: var(--border-strong)"></span></sc-if>
                  <span style="flex: 1; height: {{b.h}}px; border-radius: 3px 3px 0 0; background: {{b.c}}"></span>
                </button></sc-for>
              </div>
              <div class="mono" style="display: flex; gap: 8px; font-size: 11px; color: var(--text-3)"><sc-for list="{{bars}}" as="b"><span style="flex: 1; min-width: 0; text-align: center; overflow: hidden; white-space: nowrap">{{b.l}}</span></sc-for></div>
            </div>
          </sc-if>
          <sc-if value="{{isHeat}}" hint-placeholder-val="{{false}}">
            <div style="overflow-x: auto"><div style="display: grid; grid-template-columns: 44px repeat(12, minmax(36px, 1fr)); gap: 4px; min-width: 560px; font-size: 11px">
              <span></span><sc-for list="{{hours}}" as="h"><span class="mono" style="text-align: center; color: var(--text-3)">{{h}}</span></sc-for>
              <sc-for list="{{heat}}" as="row"><span style="color: var(--text-2); align-self: center">{{row.d}}</span><sc-for list="{{row.cells}}" as="c"><span title="{{c.t}}" style="height: 28px; border-radius: 5px; background: var(--accent); opacity: {{c.o}}"></span></sc-for></sc-for>
            </div></div>
          </sc-if>
        </section>

        <section style="border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow-x: auto">
          <div style="padding: 14px 18px; border-bottom: 1px solid var(--border)"><h3 style="margin: 0; font-size: 15px; font-weight: 600">{{tableTitle}}</h3></div>
          <table style="width: 100%; min-width: 640px; border-collapse: collapse; font-size: 13px">
            <thead><tr style="text-align: left; color: var(--text-3); font-size: 12px"><sc-for list="{{cols}}" as="c"><th style="padding: 10px 18px; font-weight: 500">{{c}}</th></sc-for></tr></thead>
            <tbody><sc-for list="{{rows}}" as="r"><tr class="row" style="border-top: 1px solid var(--border)"><sc-for list="{{r.cells}}" as="c"><td style="padding: 11px 18px; color: {{c.c}}; font-weight: {{c.w}}">
              <sc-if value="{{c.bar}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; gap: 8px"><span style="width: 90px; height: 6px; border-radius: 6px; background: var(--surface-2)"><span style="display: block; height: 6px; border-radius: 6px; width: {{c.bar}}%; background: var(--accent)"></span></span><span class="mono">{{c.v}}</span></span></sc-if>
              <sc-if value="{{c.plain}}" hint-placeholder-val="{{true}}">{{c.v}}</sc-if>
            </td></sc-for></tr></sc-for></tbody>
          </table>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>

    const fmt = (v) => (typeof v === 'number' ? Math.round(v * m).toLocaleString('en-US') : v);
    const max = d.vals ? Math.max(...d.vals) : 1;
    const bars = (d.vals || []).map((v, i) => ({ l: i % 2 === 0 ? DAYS[i] : '', h: Math.round(v / max * 210 * (d.pct ? 1 : 1)), hp: Math.round(v * d.prev / max * 210 * (1 - (i % 3) * 0.03)), c: s.drill === i ? 'var(--text)' : (d.ai ? 'var(--ai)' : 'var(--accent)'), title: DAYS[i] + ': ' + v + (d.pct ? '%' : ' conversations'), drill: () => this.setState({ drill: s.drill === i ? -1 : i }) }));
    const W = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const heat = W.map((dname, di) => ({ d: dname, cells: Array.from({ length: 12 }, (_, h) => { const base = Math.sin((h + 1) / 12 * Math.PI) * (di < 5 ? 1 : 0.6) * (h === 4 && di === 0 ? 1.15 : 1); const v = Math.min(1, Math.max(0.08, base)); return { o: v.toFixed(2), t: dname + ' ' + (h + 8 > 12 ? h - 4 + ' PM' : h + 8 + ' AM') + ': ' + Math.round(v * 92) + ' conversations' }; }) }));
    const colMax = d.barCol >= 0 ? Math.max(...d.rows.map((r) => r[d.barCol])) : 1;
    const rows = d.rows.map((r) => ({ cells: r.map((v, ci) => { const isBar = ci === d.barCol; const neg = typeof v === 'string' && (v === 'Rising' || v.includes('gap') || v === '100%'); return { v: isBar ? fmt(v) : (typeof v === 'number' ? fmt(v) : v), bar: isBar ? Math.round(v / colMax * 100) : false, plain: !isBar, c: neg ? 'var(--warn)' : (ci === 0 ? 'var(--text)' : 'var(--text-2)'), w: ci === 0 ? 500 : 400 }; }) }));
    return {
      rootClass: dark ? 'orb dark' : 'orb', dark, toggleTheme: () => this.setState({ dark: !dark }),
      secs: Object.keys(S).map((id) => { const on = s.sec === id; return { label: S[id].label.replace(' analytics', ''), cur: on ? 'page' : 'false', bg: on ? 'var(--accent-soft)' : 'transparent', color: on ? 'var(--accent-text)' : 'var(--text-2)', weight: on ? 600 : 450, pick: () => this.setState({ sec: id, drill: -1 }) }; }),
      secLabel: d.label, secDesc: d.desc,
      ranges: Object.keys(MUL).map((id) => { const on = s.range === id; return { label: id.replace('d', ' days'), pressed: on ? 'true' : 'false', bg: on ? 'var(--surface)' : 'transparent', color: on ? 'var(--text)' : 'var(--text-2)', pick: () => this.setState({ range: id }) }; }),
      compare: s.compare, toggleCompare: () => this.setState({ compare: !s.compare }),
      kpis: d.kpis.map(([l, v, t, dd, good]) => ({ l, v: fmt(v), d: dd || '—', dc: good ? 'var(--ok)' : 'var(--bad)' })),
      chartTitle: d.chart, isBars: !d.heat, isHeat: !!d.heat, bars, heat,
      hours: ['8a', '9a', '10a', '11a', '12p', '1p', '2p', '3p', '4p', '5p', '6p', '7p'],
      drillLine: d.heat ? 'Darker = more conversations. Staff up Monday 11 AM – 2 PM.' : (s.drill >= 0 ? 'Drill-down · ' + DAYS[s.drill] + ': ' + d.vals[s.drill] + (d.pct ? '% CSAT' : ' conversations') + ' · 64% AI · 31% human · peak at 12 PM · click again to clear' : 'Click a day to drill down'),
      tableTitle: d.table, cols: d.cols, rows
    };
  }
}
